<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | VoteX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #123b75, #2563a6);
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            color: #123b75;
            margin-bottom: 8px;
        }

        .logo span {
            color: #2563eb;
        }

        .admin-icon {
            font-size: 55px;
            margin: 20px 0 12px;
        }

        h2 {
            color: #173b70;
            margin-bottom: 10px;
            font-size: 25px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #173b70;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            padding: 5px;
            margin: 0;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #123b75;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #2563a6;
            transform: translateY(-2px);
        }

        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">Vote<span>X</span></div>

        <div class="admin-icon">🔐</div>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Login to access the VoteX Administration Panel.
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/admin-login">

            <div class="form-group">

                <label for="email">Admin Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button type="submit" class="login-btn">
                Login as Admin
            </button>

        </form>

        <a href="/" class="back-link">
            ← Back to Home
        </a>

        <div class="footer">
            © 2026 VoteX | Administration Panel
        </div>

    </div>

    <script>
        function togglePassword() {

            const password = document.getElementById("password");
            const button = document.querySelector(".toggle");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>

</html>
