<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Login | VoteX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(23, 59, 112, 0.12);
        }

        .logo {
            text-align: center;
            color: #173b70;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #173b70;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #173b70;
            box-shadow: 0 0 0 3px rgba(23, 59, 112, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #173b70;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        button.login-btn {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #173b70;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button.login-btn:hover {
            background: #28569a;
            transform: translateY(-2px);
        }

        .links {
            text-align: center;
            margin-top: 25px;
            line-height: 2.2;
            font-size: 14px;
        }

        .links a {
            color: #173b70;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">VoteX</div>

        <h1>Voter Login</h1>

        <p class="subtitle">
            Login to participate in your college elections.
        </p>

        <form action="/login" method="POST">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword()"
                >
                    Show
                </button>

            </div>

            <button type="submit" class="login-btn">
                Login to Vote
            </button>

        </form>

        <div class="links">
            <a href="/">Back to Home</a>
            <br>
            Don't have an account?
            <a href="/register">Register Here</a>
        </div>

        <div class="footer">
            © 2026 VoteX | College Election Project
        </div>

    </div>

    <script>
        function togglePassword() {

            const password = document.getElementById("password");
            const button = document.querySelector(".toggle");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>

</html>
